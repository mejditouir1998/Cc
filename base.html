<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}بوابة الحسابات{% endblock %}</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 15% 15%,#263c5b 0,transparent 34%),linear-gradient(135deg,#0b1220,#17243a 58%,#101827);font-family:Tahoma,Arial,sans-serif;color:#f8fafc}
.card{width:min(100%,520px);padding:30px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff0d;backdrop-filter:blur(14px);box-shadow:0 24px 70px #0006}.wide{width:min(100%,980px)}
h1,h2{margin:0 0 12px}h1{text-align:center;font-size:25px}h2{font-size:20px}.intro{text-align:center;color:#b9c5d6;font-size:14px;line-height:1.8;margin:0 0 22px}
label{display:block;margin:14px 0 7px;font-size:14px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #ffffff28;background:#0b1423;color:#fff;font-size:15px;outline:none}input:focus{border-color:#60a5fa}
button{border:0;border-radius:10px;padding:10px 14px;background:#3b82f6;color:#fff;font-weight:bold;cursor:pointer}button:hover{background:#2563eb}.submit{width:100%;margin-top:18px;padding:14px;font-size:16px}.secondary{background:#334155}.danger{background:#b91c1c}
a{color:#93c5fd;text-decoration:none}.foot{text-align:center;color:#a9b7ca;font-size:13px;margin-top:18px}.flash{padding:11px 13px;border-radius:10px;margin:10px 0;font-size:13px;background:#123b31;color:#a7f3d0}.flash.error{background:#4b2026;color:#fecaca}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.top h1{text-align:right;margin:0}.tag{padding:6px 11px;border-radius:30px;background:#1e3a5f;color:#bfdbfe;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#0b1423;border:1px solid #ffffff15;border-radius:13px;padding:15px;text-align:center}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:#a9b7ca}
.table-wrap{overflow:auto;border:1px solid #ffffff20;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:650px;font-size:13px}th,td{padding:12px;text-align:right;border-bottom:1px solid #ffffff18}th{background:#0b1423;color:#cbd5e1}td{color:#e2e8f0}.inline{display:inline-block;margin:2px}
@media(max-width:540px){body{padding:12px}.card{padding:22px 17px}.stats{grid-template-columns:1fr}}
</style></head><body>{% block body %}{% endblock %}</body></html>
